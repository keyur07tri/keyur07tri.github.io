<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A;
    --black2:#151210;
    --gold:#C9A24B;
    --gold-light:#E8CE8C;
    --grey:#8A8378;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 30%, #1A1610 0%, var(--black) 65%);
    color:#EDE7DA;
    font-family:'Cormorant Garamond', serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* faint vignette texture */
  body::before{
    content:'';
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
    pointer-events:none;
  }

  .stage{
    text-align:center;
    padding:40px;
    max-width:640px;
    position:relative;
    z-index:1;
    opacity:0;
    animation:reveal 1.4s ease-out 0.2s forwards;
  }

  @keyframes reveal{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .ornament{
    width:72px; height:72px;
    margin:0 auto 28px;
  }
  .ornament svg{width:100%; height:100%;}

  .eyebrow{
    font-family:'Marcellus', serif;
    font-size:12px;
    letter-spacing:0.32em;
    color:var(--gold);
    margin-bottom:22px;
  }

  h1{
    font-family:'Marcellus', serif;
    font-weight:400;
    font-size:clamp(38px, 7vw, 64px);
    letter-spacing:0.04em;
    color:#F4EBD6;
    line-height:1.1;
  }

  .rule{
    width:120px;
    height:1px;
    margin:30px auto;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .sub{
    font-size:19px;
    font-style:italic;
    color:var(--grey);
    letter-spacing:0.02em;
  }

  .footer-mark{
    position:absolute;
    bottom:36px;
    left:0; right:0;
    text-align:center;
    font-family:'Marcellus', serif;
    font-size:11px;
    letter-spacing:0.28em;
    color:#4A4438;
    z-index:1;
  }

  @media(max-width:480px){
    .sub{font-size:16px;}
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="ornament">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="1.5" fill="#C9A24B"/>
        <path d="M50 10 L50 40" stroke="#C9A24B" stroke-width="1"/>
        <path d="M50 60 L50 90" stroke="#C9A24B" stroke-width="1"/>
        <path d="M10 50 L40 50" stroke="#C9A24B" stroke-width="1"/>
        <path d="M60 50 L90 50" stroke="#C9A24B" stroke-width="1"/>
        <circle cx="50" cy="50" r="22" stroke="#C9A24B" stroke-width="0.75"/>
      </svg>
    </div>

    <div class="eyebrow">Est. 2026</div>
    <h1>We Are Arriving</h1>
    <div class="rule"></div>
    <p class="sub">Something distinguished is being written.</p>
  </div>

  <div class="footer-mark">COMING SOON</div>

</body>
</html>
